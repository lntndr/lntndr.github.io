<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Andrea Lanterna lavora per IDA tra Milano e la Liguria." />
  <meta name="author" content="Andrea Lanterna" />
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://andrealanterna.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://andrealanterna.com/" />
  <meta property="og:title" content="Andrea Lanterna" />
  <meta property="og:description" content="Andrea Lanterna lavora per IDA tra Milano e la Liguria." />
  <title>Andrea Lanterna</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Andrea Lanterna",
      "url": "https://andrealanterna.com/",
      "description": "Andrea Lanterna lavora per IDA tra Milano e la Liguria.",
      "jobTitle": "Membro del consiglio direttivo di IDA",
      "nationality": "Italian",
      "knowsLanguage": ["it", "en", "fr"],
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://andrealanterna.com/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #f5f5f5;
      --text: #222222;
      --link: #0d7abf;
      --circle-bg: #1B98E0;
      --text-muted: #555555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #222222;
        --text: #f5f5f5;
        --link: #4db8e8;
        --circle-bg: #1B98E0;
        --text-muted: #cccccc;
      }
    }
    @font-face {
      font-family: 'Source Serif';
      src: url('fonts/SourceSerif4Variable-Roman.otf.woff2') format('woff2');
      font-style: normal;
      font-weight: 1 999;
      font-display: swap;
    }
    @font-face {
      font-family: 'Source Serif';
      src: url('fonts/SourceSerif4Variable-Italic.otf.woff2') format('woff2');
      font-style: italic;
      font-weight: 1 999;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: 'Source Serif', Georgia, serif;
      color: var(--text);
      box-sizing: border-box;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4vh 7vw;
    }
    header, footer, main {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }
    header {
      margin-top: 5vh;
      line-height: 1.2;
    }
    @media (max-width: 600px) {
      header {
        margin-top: 2vh;
      }
    }
    header h1 {
      display: inline;
      font-size: 1.618em;
      font-weight: 400;
      font-variant-caps: small-caps;
      color: var(--text-muted);
      margin: 0;
    }
    header p {
      display: inline;
      font-size: 1.618em;
      margin: 0;
    }
    a {
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .canvas-wrapper noscript {
      color: var(--text);
      font-size: 1.2em;
      font-style: italic;
      text-align: center;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
    footer {
      text-align: center;
      font-size: 1em;
      color: var(--text);
      margin-top: 20px;
      padding-bottom: 0.5vh;
    }
    ::selection {
      background: var(--text);
      color: var(--bg);
    }

    ::-moz-selection {
      background: var(--text);
      color: var(--bg);
    }

    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
<header>
<h1>Andrea Lanterna</h1>
<p>❧ Lavoro per IDA tra Milano e la Liguria. Nell'attesa di un sito migliore puoi contattarmi <a href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;%61%6E%64%72%65%61%40%69%64%61%66%6F%74%6F%67%72%61%66%69%61%2E%63%6F%6D">qui</a>.</p>
</header>
<main>
  <div class="canvas-wrapper">
    <canvas id="ps2Canvas" aria-hidden="true"></canvas>
    <noscript>
      <p>Se nel browser vi fosse un po' di JavaScript il sito ne sarebbe assai più bello</p>
    </noscript>
  </div>
</main>
<footer>
  &copy; 2026 AL ❧ <a href="https://medium.com/@andrealanterna">medium</a>
</footer>

<script type="module">
  import { startCanvasAnimation } from './canvasAnimation.js';

  Promise.all([
    document.fonts.ready,
    new Promise(resolve => window.addEventListener('DOMContentLoaded', resolve))
  ]).then(() => {
    requestAnimationFrame(() => {
      startCanvasAnimation();
    });
  });
</script>
</body>
</html>
